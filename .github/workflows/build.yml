name: Build Windows MSVC

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows-msvc:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt6 через официальный installer-action
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'
        install-deps: 'true'
        modules: 'qt6charts qt6svg'
        dir: '${{ github.workspace }}/Qt'
        setup-python: 'false'
        tools: 'tools_ifw'

    # Настройка Visual Studio environment
    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Настройка CMake для MSVC
    - name: Configure CMake
      run: |
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.5.0/msvc2019_64" `
          -S . -B build

    # Сборка проекта
    - name: Build
      run: |
        cmake --build build --config Release --parallel

    # Установка (копирование файлов)
    - name: Install
      run: |
        cmake --install build --config Release --prefix install

    # Поиск исполняемого файла
    - name: Debug - Find Executable
      shell: pwsh
      run: |
        Write-Host "=== Searching for .exe files ==="
        Get-ChildItem -Recurse -Path build -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Build: $($_.FullName)" }
        Get-ChildItem -Recurse -Path install -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Install: $($_.FullName)" }

    # Подготовка исполняемого файла
    - name: Prepare Executable
      shell: pwsh
      run: |
        $workspace = "${{ github.workspace }}"
        $targetDir = "$workspace\release"
        New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
        
        # Ищем исполняемый файл
        $exe = Get-ChildItem -Recurse -Path "$workspace\build" -Filter "SmoothGraphs.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if (-not $exe) {
            Write-Error "SmoothGraphs.exe not found!"
            exit 1
        }
        
        Write-Host "Found executable: $($exe.FullName)"
        Copy-Item $exe.FullName "$targetDir\SmoothGraphs.exe" -Force
        Write-Host "Copied to: $targetDir\SmoothGraphs.exe"

    # Развертывание Qt DLLs с помощью windeployqt (MSVC версия)
    - name: Deploy Qt Dependencies
      shell: pwsh
      run: |
        $qtDir = "${{ github.workspace }}/Qt/6.5.0/msvc2019_64"
        $appDir = "${{ github.workspace }}\release"
        $exePath = "$appDir\SmoothGraphs.exe"
        
        # Находим windeployqt
        $windeployqt = Get-ChildItem -Path $qtDir -Recurse -Filter "windeployqt.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
        
        if (-not $windeployqt) {
            Write-Error "windeployqt.exe not found in $qtDir"
            exit 1
        }
        
        Write-Host "Using windeployqt: $($windeployqt.FullName)"
        
        # Добавляем путь к Qt DLL в PATH
        $env:PATH = "$qtDir\bin;$env:PATH"
        
        # Запускаем windeployqt с правильными параметрами
        & $windeployqt.FullName --release --no-compiler-runtime --no-system-d3d-compiler --no-opengl-sw --no-virtualkeyboard --no-angle --no-quick-import --no-translations --verbose 1 $exePath
        
        if ($LASTEXITCODE -ne 0) {
            Write-Warning "windeployqt exited with code $LASTEXITCODE"
        }
        
        # Дополнительно копируем Visual C++ Redistributable
        $vcRedistDir = "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Redist/MSVC"
        if (Test-Path $vcRedistDir) {
            $latestVCRedist = Get-ChildItem -Path $vcRedistDir -Directory | Sort-Object Name -Descending | Select-Object -First 1
            $vcRedistPath = Join-Path $latestVCRedist.FullName "x64\Microsoft.VC143.CRT\*.dll"
            Copy-Item $vcRedistPath $appDir -Force -ErrorAction SilentlyContinue
            Write-Host "Copied VC Redist DLLs"
        }
        
        Write-Host "✅ Deployment completed"

    # Копирование иконки
    - name: Copy application icon
      shell: pwsh
      run: |
        $appDir = "${{ github.workspace }}\release"
        $iconSrc = "${{ github.workspace }}\resources\graph.ico"
        
        if (Test-Path $iconSrc) {
            Copy-Item $iconSrc "$appDir\graph.ico" -Force
            Write-Host "Icon copied to $appDir"
        } else {
            Write-Warning "Icon not found: $iconSrc"
        }

    # Тестирование приложения
    - name: Test Application
      shell: pwsh
      run: |
        $appDir = "${{ github.workspace }}\release"
        $exePath = "$appDir\SmoothGraphs.exe"
        
        Write-Host "Testing application startup..."
        try {
            $process = Start-Process -FilePath $exePath -NoNewWindow -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 3
            if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
                Write-Host "✅ Application started successfully!"
            } else {
                Write-Error "Application exited immediately with code: $($process.ExitCode)"
                exit 1
            }
        } catch {
            Write-Error "Failed to start application: $_"
            exit 1
        }

    # Создание ZIP архива
    - name: Create ZIP Archive
      shell: pwsh
      run: |
        $releaseDir = "${{ github.workspace }}\release"
        $zipPath = "${{ github.workspace }}\SmoothGraphs-Windows-MSVC-x64.zip"
        
        Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force
        Write-Host "Created archive: $zipPath"

    # Загрузка артефакта
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-MSVC-x64
        path: release/
        retention-days: 30

    # Загрузка ZIP архива (опционально)
    - name: Upload ZIP Archive
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-MSVC-x64-ZIP
        path: SmoothGraphs-Windows-MSVC-x64.zip
        retention-days: 30
