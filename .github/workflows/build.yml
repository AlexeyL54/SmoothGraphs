name: Build Windows MSVC (vcpkg)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows-msvc:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Create vcpkg.json
      shell: pwsh
      run: |
        $vcpkgJson = @"
        {
          "name": "smoothgraphs",
          "version": "1.0.0",
          "dependencies": [
            "qt6-base"
          ]
        }
        "@
        $vcpkgJson | Out-File -FilePath "vcpkg.json" -Encoding UTF8
        Write-Host "Created vcpkg.json with Qt6 dependencies"

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: 'C:/vcpkg'
        vcpkgGitCommitId: '2024.01.12'  # Стабильный коммит vcpkg
        runVcpkgInstall: true

    - name: Configure CMake
      run: |
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -DVCPKG_TARGET_TRIPLET=x64-windows `
          -S . -B build

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Prepare Release
      shell: pwsh
      run: |
        $releaseDir = "${{ github.workspace }}\release"
        New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
        
        # Копируем exe
        $exePath = "${{ github.workspace }}\build\Release\SmoothGraphs.exe"
        if (Test-Path $exePath) {
          Copy-Item $exePath "$releaseDir\SmoothGraphs.exe" -Force
          Write-Host "✓ Executable copied"
        } else {
          Write-Error "Executable not found at $exePath"
          exit 1
        }
        
        # Копируем Qt DLLs из vcpkg
        $qtDllPath = "C:/vcpkg/installed/x64-windows/bin"
        if (Test-Path $qtDllPath) {
          $dlls = @("Qt6Core.dll", "Qt6Gui.dll", "Qt6Widgets.dll")
          foreach ($dll in $dlls) {
            $src = Join-Path $qtDllPath $dll
            if (Test-Path $src) {
              Copy-Item $src "$releaseDir\" -Force
              Write-Host "✓ Copied $dll"
            }
          }
        }
        
        # Копируем плагины Qt
        $qtPluginsPath = "C:/vcpkg/installed/x64-windows/plugins"
        if (Test-Path $qtPluginsPath) {
          $plugins = @("platforms", "styles", "imageformats")
          foreach ($plugin in $plugins) {
            $src = Join-Path $qtPluginsPath $plugin
            if (Test-Path $src) {
              Copy-Item -Recurse $src "$releaseDir\$plugin" -Force
              Write-Host "✓ Copied plugin: $plugin"
            }
          }
        }
        
        Write-Host "✅ Release prepared in $releaseDir"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-x64
        path: release/
        retention-days: 30
