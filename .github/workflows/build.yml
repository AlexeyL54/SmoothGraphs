name: Build Windows (MSVC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка Qt (обновлённая версия)
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.7.2'           # Обновлено с 6.5.0 до 6.7.2
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2019_64'  # Используем MSVC 2022 (совместим с windows-latest)
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    # Настройка CMake
    - name: Configure CMake
      run: |
        cmake -B build `
          -G "Visual Studio 18 2026" `        
          -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/Qt/6.7.2/msvc2022_64" `
          -DCMAKE_INSTALL_PREFIX=install

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    # Деплой Qt DLLs
    - name: Deploy Qt DLLs (windeployqt)
      shell: pwsh
      run: |
        # Находим windeployqt.exe
        $winDeployQt = Get-Command windeployqt.exe -ErrorAction SilentlyContinue

        if (-not $winDeployQt) {
            # Стандартный путь для новой версии
            $qtRoot = "C:\Qt\6.7.2\msvc2022_64"
            $winDeployQtPath = Join-Path $qtRoot "bin\windeployqt.exe"

            if (Test-Path $winDeployQtPath) {
                $winDeployQt = $winDeployQtPath
            } else {
                # Путь из workspace
                $wsQtPath = "${{ github.workspace }}\Qt\6.7.2\msvc2022_64\bin\windeployqt.exe"
                if (Test-Path $wsQtPath) {
                    $winDeployQt = $wsQtPath
                } else {
                    Write-Error "❌ windeployqt.exe not found"
                    exit 1
                }
            }
        } else {
            $winDeployQt = $winDeployQt.Source
        }

        Write-Host "Using windeployqt from: $winDeployQt"

        $appPath = "${{ github.workspace }}\install\bin\SmoothGraphs.exe"

        if (-not (Test-Path $appPath)) {
            Write-Error "❌ Application executable not found at: $appPath"
            exit 1
        }

        Write-Host "Running windeployqt..."
        & $winDeployQt --release --no-compiler-runtime --no-opengl-sw --no-translations "$appPath"

        if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ windeployqt failed with exit code $LASTEXITCODE"
            exit 1
        }
        Write-Host "✅ Qt dependencies deployed."

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-x64
        path: install/
        retention-days: 30
