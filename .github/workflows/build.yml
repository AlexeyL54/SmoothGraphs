name: Build Windows MSVC (vcpkg)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows-msvc:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: 'C:/vcpkg'
        vcpkgGitCommit: 'master'

    - name: Install Qt6 via vcpkg
      run: |
        C:/vcpkg/vcpkg install qt6-base:x64-windows

    - name: Configure CMake
      run: |
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake `
          -S . -B build

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Prepare Release
      shell: pwsh
      run: |
        $releaseDir = "${{ github.workspace }}\release"
        New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
        
        $exePath = "${{ github.workspace }}\build\Release\SmoothGraphs.exe"
        Copy-Item $exePath "$releaseDir\SmoothGraphs.exe" -Force
        
        Write-Host "✅ Release prepared"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-x64
        path: release/
        retention-days: 30
