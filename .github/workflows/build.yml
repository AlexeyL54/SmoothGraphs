name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка MSYS2 с MinGW-w64
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-qt6

    # Установка Qt (базовые компоненты)
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    - name: Configure CMake
      run: |
        cmake -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
          -S . -B build

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Debug - Find Executable
      shell: pwsh
      run: |
        Write-Host "=== Searching for .exe files ==="
        Get-ChildItem -Recurse -Path build -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Build: $($_.FullName)" }
        Get-ChildItem -Recurse -Path install -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Install: $($_.FullName)" }

    - name: Prepare Executable for Deployment
      shell: pwsh
      run: |
        $ws = "${{ github.workspace }}"
        $target = "$ws\install\bin\SmoothGraphs.exe"
        $candidates = @(
          "$ws\install\SmoothGraphs.exe",
          "$ws\build\SmoothGraphs.exe",
          "$ws\build\Release\SmoothGraphs.exe"
        )

        if (Test-Path $target) {
          Write-Host "Found at target: $target"
        } else {
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Host "Found at: $c"
              New-Item -ItemType Directory -Force -Path "$ws\install\bin" | Out-Null
              Copy-Item $c "$ws\install\bin\\"
              break
            }
          }
        }

        if (-not (Test-Path $target)) {
          $found = Get-ChildItem -Recurse -Path build, install -Filter "SmoothGraphs.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            Write-Host "Recursive found: $($found.FullName)"
            New-Item -ItemType Directory -Force -Path "$ws\install\bin" | Out-Null
            Copy-Item $found.FullName "$ws\install\bin\\"
          }
        }

        if (-not (Test-Path $target)) {
          Write-Error "SmoothGraphs.exe NOT FOUND!"
          exit 1
        }
        Write-Host "Ready: $target"

    - name: Copy application icon
      shell: pwsh
      run: |
        $iconSrc = "${{ github.workspace }}/resources/graph.ico"
        $iconDst = "${{ github.workspace }}\install\bin\graph.ico"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\install\bin" | Out-Null
        if (Test-Path $iconSrc) {
          Copy-Item $iconSrc $iconDst -Force
          Write-Host "Icon copied: $iconDst"
        } else {
          Write-Error "Icon not found: $iconSrc"
          exit 1
        }

    - name: Deploy Qt DLLs (windeployqt)
      shell: pwsh
      run: |
        # 1. Находим windeployqt.exe
        $winDeployQt = Get-Command windeployqt.exe -ErrorAction SilentlyContinue

        if (-not $winDeployQt) {
            Write-Error "❌ windeployqt.exe not found in PATH"
            exit 1
        }
        $winDeployQtPath = $winDeployQt.Source
        Write-Host "Using windeployqt from: $winDeployQtPath"

        # 2. Определяем пути правильно для структуры install-qt-action
        # windeployqt лежит в: .../Qt/6.5.0/mingw_64/bin/windeployqt.exe
        # Нам нужно подняться на 3 уровня вверх до папки версии (6.5.0)
        $qtBinDir = Split-Path $winDeployQtPath -Parent
        $qtArchDir = Split-Path $qtBinDir -Parent       # .../mingw_64
        $qtVersionDir = Split-Path $qtArchDir -Parent   # .../6.5.0
        
        $qtPluginDir = Join-Path $qtVersionDir "plugins"
        $qtQmlDir = Join-Path $qtVersionDir "qml"

        Write-Host "Qt Version Dir: $qtVersionDir"
        Write-Host "Qt Plugin Dir: $qtPluginDir"
        Write-Host "Qt Qml Dir: $qtQmlDir"

        if (-not (Test-Path $qtPluginDir)) {
            Write-Error "❌ Plugins directory not found at: $qtPluginDir. Check Qt installation structure."
            # Попробуем найти папку plugins рекурсивно рядом для отладки
            Get-ChildItem -Path $qtVersionDir -Filter "plugins" -Recurse -Directory | Select-Object FullName
            exit 1
        }

        # Путь к приложению
        $appPath = "${{ github.workspace }}\install\bin\SmoothGraphs.exe"

        if (-not (Test-Path $appPath)) {
            Write-Error "❌ Application executable not found at: $appPath"
            exit 1
        }

        # 3. Запуск windeployqt с явным указанием путей
        Write-Host "Running windeployqt..."
        
        $args = @(
            "--release",
            "--no-compiler-runtime", # Мы копируем рантайм отдельно или он уже в PATH
            "--no-opengl-sw",
            "--no-translations",
            "--qt-bin-dir", $qtBinDir,
            "--plugin-dir", $qtPluginDir,
            # "--qml-dir", $qtQmlDir, # Раскомментируйте, если используете QtQuick/QML
            "`"$appPath`""
        )

        & $winDeployQtPath $args

        if ($LASTEXITCODE -ne 0) {
            Write-Error "❌ windeployqt failed with exit code $LASTEXITCODE"
            exit 1
        }

        # 4. Копирование runtime библиотек MinGW (libgcc, libstdc++, libwinpthread)
        # Они обычно лежат в той же папке bin, что и компилятор
        Write-Host "Copying MinGW runtime libraries..."
        $mingwRuntime = @(
            "libgcc_s_seh-1.dll",
            "libstdc++-6.dll",
            "libwinpthread-1.dll"
        )

        foreach ($dll in $mingwRuntime) {
            $src = Join-Path $qtBinDir $dll
            $dst = Join-Path (Split-Path $appPath -Parent) $dll
            if (Test-Path $src) {
                Copy-Item $src $dst -Force
                Write-Host "Copied $dll"
            } else {
                Write-Warning "MinGW runtime $dll not found in $qtBinDir"
            }
        }

        Write-Host "✅ Deployment completed successfully."
          
    - name: Copy MinGW runtime DLLs
      shell: pwsh
      run: |
        # Копируем необходимые runtime DLL от MinGW
        $mingwBinDir = "C:\msys64\ucrt64\bin"
        $installBinDir = "${{ github.workspace }}\install\bin"

        $requiredDlls = @(
            "libgcc_s_seh-1.dll",
            "libstdc++-6.dll",
            "libwinpthread-1.dll"
        )

        foreach ($dll in $requiredDlls) {
            $src = Join-Path $mingwBinDir $dll
            $dst = Join-Path $installBinDir $dll

            if (Test-Path $src) {
                Copy-Item $src $dst
                Write-Host "✅ Copied: $dll"
            } else {
                Write-Warning "⚠️ Not found: $dll"
            }
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-x64
        path: install/
        retention-days: 30
