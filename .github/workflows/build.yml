name: Build Windows

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Установка MSYS2 с MinGW-w64
    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          mingw-w64-ucrt-x86_64-cmake
          mingw-w64-ucrt-x86_64-ninja
          mingw-w64-ucrt-x86_64-gcc
          mingw-w64-ucrt-x86_64-qt6

    # Установка Qt (базовые компоненты)
    - name: Setup Qt6
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.5.0'
        host: 'windows'
        target: 'desktop'
        arch: 'win64_mingw'
        install-deps: 'true'
        dir: ${{ github.workspace }}/Qt

    - name: Configure CMake
      run: |
        cmake -G "MinGW Makefiles" `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/install" `
          -S . -B build

    - name: Build
      run: |
        cmake --build build --config Release --parallel

    - name: Install
      run: |
        cmake --install build --config Release

    - name: Debug - Find Executable
      shell: pwsh
      run: |
        Write-Host "=== Searching for .exe files ==="
        Get-ChildItem -Recurse -Path build -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Build: $($_.FullName)" }
        Get-ChildItem -Recurse -Path install -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "Install: $($_.FullName)" }

    - name: Prepare Executable for Deployment
      shell: pwsh
      run: |
        $ws = "${{ github.workspace }}"
        $target = "$ws\install\bin\SmoothGraphs.exe"
        $candidates = @(
          "$ws\install\SmoothGraphs.exe",
          "$ws\build\SmoothGraphs.exe",
          "$ws\build\Release\SmoothGraphs.exe"
        )

        if (Test-Path $target) {
          Write-Host "Found at target: $target"
        } else {
          foreach ($c in $candidates) {
            if (Test-Path $c) {
              Write-Host "Found at: $c"
              New-Item -ItemType Directory -Force -Path "$ws\install\bin" | Out-Null
              Copy-Item $c "$ws\install\bin\\"
              break
            }
          }
        }

        if (-not (Test-Path $target)) {
          $found = Get-ChildItem -Recurse -Path build, install -Filter "SmoothGraphs.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($found) {
            Write-Host "Recursive found: $($found.FullName)"
            New-Item -ItemType Directory -Force -Path "$ws\install\bin" | Out-Null
            Copy-Item $found.FullName "$ws\install\bin\\"
          }
        }

        if (-not (Test-Path $target)) {
          Write-Error "SmoothGraphs.exe NOT FOUND!"
          exit 1
        }
        Write-Host "Ready: $target"

    - name: Copy application icon
      shell: pwsh
      run: |
        $iconSrc = "${{ github.workspace }}/resources/graph.ico"
        $iconDst = "${{ github.workspace }}\install\bin\graph.ico"
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\install\bin" | Out-Null
        if (Test-Path $iconSrc) {
          Copy-Item $iconSrc $iconDst -Force
          Write-Host "Icon copied: $iconDst"
        } else {
          Write-Error "Icon not found: $iconSrc"
          exit 1
        }

    - name: Deploy Qt DLLs (Manual)
      shell: pwsh
      run: |
        # 1. Находим Qt
        $windeployqt = Get-Command windeployqt.exe -ErrorAction SilentlyContinue
        if (-not $windeployqt) {
            Write-Error "windeployqt.exe not found"
            exit 1
        }
        
        $qtBinDir = Split-Path $windeployqt.Source -Parent
        $qtMingwDir = Split-Path $qtBinDir -Parent
        $qtPluginDir = Join-Path $qtMingwDir "plugins"
        
        Write-Host "Qt Bin Dir: $qtBinDir"
        Write-Host "Qt Plugin Dir: $qtPluginDir"
        
        $appDir = "${{ github.workspace }}\install\bin"
        $appPath = Join-Path $appDir "SmoothGraphs.exe"
        
        if (-not (Test-Path $appPath)) {
            Write-Error "App not found: $appPath"
            exit 1
        }
        
        # 2. Копируем основные Qt DLL
        Write-Host "Copying Qt DLLs..."
        $qtDlls = @(
            "Qt6Core.dll",
            "Qt6Gui.dll",
            "Qt6Widgets.dll"
        )
        
        foreach ($dll in $qtDlls) {
            $src = Join-Path $qtBinDir $dll
            $dst = Join-Path $appDir $dll
            if (Test-Path $src) {
                Copy-Item $src $dst -Force
                Write-Host "  Copied $dll"
            } else {
                Write-Warning "  Not found: $dll"
            }
        }
        
        # 3. Копируем runtime библиотеки MinGW
        Write-Host "Copying MinGW runtime..."
        $mingwRuntime = @(
            "libgcc_s_seh-1.dll",
            "libstdc++-6.dll",
            "libwinpthread-1.dll"
        )
        
        foreach ($dll in $mingwRuntime) {
            $src = Join-Path $qtBinDir $dll
            $dst = Join-Path $appDir $dll
            if (Test-Path $src) {
                Copy-Item $src $dst -Force
                Write-Host "  Copied $dll"
            } else {
                Write-Warning "  Not found: $dll"
            }
        }
        
        # 4. Копируем платформенный плагин (обязательно!)
        Write-Host "Copying platform plugin..."
        $srcPlatforms = Join-Path $qtPluginDir "platforms"
        $dstPlatforms = Join-Path $appDir "platforms"
        
        if (Test-Path $srcPlatforms) {
            New-Item -ItemType Directory -Force -Path $dstPlatforms | Out-Null
            Copy-Item "$srcPlatforms\qwindows.dll" "$dstPlatforms\" -Force
            Write-Host "  Copied platforms/qwindows.dll"
        } else {
            Write-Error "Platforms plugin not found at: $srcPlatforms"
            exit 1
        }
        
        # 5. Копируем стили (опционально, но рекомендуется)
        Write-Host "Copying styles..."
        $srcStyles = Join-Path $qtPluginDir "styles"
        $dstStyles = Join-Path $appDir "styles"
        
        if (Test-Path $srcStyles) {
            New-Item -ItemType Directory -Force -Path $dstStyles | Out-Null
            Copy-Item "$srcStyles\qwindowsvistastyle.dll" "$dstStyles\" -Force -ErrorAction SilentlyContinue
            Write-Host "  Copied styles"
        }
        
        # 6. Копируем imageformats (для поддержки изображений)
        Write-Host "Copying image formats..."
        $srcImageFormats = Join-Path $qtPluginDir "imageformats"
        $dstImageFormats = Join-Path $appDir "imageformats"
        
        if (Test-Path $srcImageFormats) {
            New-Item -ItemType Directory -Force -Path $dstImageFormats | Out-Null
            Copy-Item "$srcImageFormats\*" "$dstImageFormats\" -Force
            Write-Host "  Copied imageformats"
        }
        
        # 7. Копируем iconengines (для иконок)
        Write-Host "Copying icon engines..."
        $srcIconEngines = Join-Path $qtPluginDir "iconengines"
        $dstIconEngines = Join-Path $appDir "iconengines"
        
        if (Test-Path $srcIconEngines) {
            New-Item -ItemType Directory -Force -Path $dstIconEngines | Out-Null
            Copy-Item "$srcIconEngines\*" "$dstIconEngines\" -Force
            Write-Host "  Copied iconengines"
        }
        
        Write-Host "✅ Manual deployment completed successfully!"
        
        # 8. Проверка - запускаем приложение чтобы убедиться
        Write-Host "Testing application..."
        try {
            $process = Start-Process -FilePath $appPath -NoNewWindow -PassThru -ErrorAction Stop
            Start-Sleep -Seconds 2
            if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force
                Write-Host "✅ Application started successfully!"
            }
        } catch {
            Write-Warning "Could not test application: $_"
        }

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-x64
        path: install/
        retention-days: 30
