name: Build Windows MSVC (Simplified)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-windows-msvc:
    runs-on: windows-2022  # Используем Windows 2022 с предустановленным Qt

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Настройка Visual Studio
    - name: Add MSVC to PATH
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Qt уже предустановлен на windows-2022
    - name: Setup Qt environment
      shell: pwsh
      run: |
        $qtPath = "C:\Qt\6.5.0\msvc2019_64"
        if (Test-Path $qtPath) {
          echo "QT_PATH=$qtPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "Qt found at $qtPath"
        } else {
          Write-Error "Qt not found at $qtPath"
          exit 1
        }

    # Настройка CMake
    - name: Configure CMake
      run: |
        cmake -G "Visual Studio 17 2022" -A x64 `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_PREFIX_PATH="$env:QT_PATH" `
          -S . -B build

    # Сборка
    - name: Build
      run: |
        cmake --build build --config Release --parallel

    # Подготовка и деплой
    - name: Prepare Release
      shell: pwsh
      run: |
        $qtPath = $env:QT_PATH
        $releaseDir = "${{ github.workspace }}\release"
        New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
        
        # Копируем exe
        $exePath = "${{ github.workspace }}\build\Release\SmoothGraphs.exe"
        if (Test-Path $exePath) {
          Copy-Item $exePath "$releaseDir\" -Force
        } else {
          Write-Error "Executable not found"
          exit 1
        }
        
        # Запускаем windeployqt
        $windeployqt = "$qtPath\bin\windeployqt.exe"
        & $windeployqt --release "$releaseDir\SmoothGraphs.exe"
        
        Write-Host "✅ Release prepared in $releaseDir"

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SmoothGraphs-Windows-x64
        path: release/
        retention-days: 30
